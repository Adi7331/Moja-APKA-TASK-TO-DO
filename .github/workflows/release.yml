name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure app and signing
        shell: bash
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-signing.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-signing.jks\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
      - name: Build release APK
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          flutter pub get
          flutter build apk --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --dart-define=APP_VERSION="$VERSION"
          mkdir -p release-assets
          zip -j "release-assets/dzien-po-dniu-android-v${VERSION}.zip" build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*.zip
          if-no-files-found: error

  windows:
    name: Windows application
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure app
        shell: pwsh
        run: |
          "SUPABASE_URL=$env:SUPABASE_URL" | Set-Content .env
          "SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" | Add-Content .env
      - name: Build Windows release
        shell: pwsh
        run: |
          $version = ('${{ inputs.tag || github.ref_name }}').TrimStart('v')
          flutter pub get
          flutter build windows --release --build-name $version --build-number $env:GITHUB_RUN_NUMBER --dart-define=APP_VERSION=$version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release-assets/dzien-po-dniu-windows-v$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create update manifest
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPOSITORY="${{ github.repository }}"
          cat > release-assets/update.json <<EOF
          {
            "version": "${VERSION}",
            "androidUrl": "https://github.com/${REPOSITORY}/releases/download/${TAG}/dzien-po-dniu-android-v${VERSION}.zip",
            "windowsUrl": "https://github.com/${REPOSITORY}/releases/download/${TAG}/dzien-po-dniu-windows-v${VERSION}.zip",
            "notes": "Aktualizacje dla Androida oraz Windows."
          }
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/update.json
          fail_on_unmatched_files: true

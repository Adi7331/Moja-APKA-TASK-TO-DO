name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure app and signing
        shell: bash
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-signing.jks
          if [[ ! -s android/app/release-signing.jks ]]; then
            echo "ANDROID_KEYSTORE_BASE64 did not decode to a non-empty keystore" >&2
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-signing.jks\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
      - name: Build release APK
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          # Tag format check: [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z; received: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))
          ANDROID_BUILD_NUMBER=$((major * 1000000 + minor * 1000 + patch))
          flutter pub get
          flutter analyze --no-pub
          # Widget tests run in the Windows job below. Running the renderer-heavy
          # suite on ubuntu-latest produces three host-renderer-only failures even
          # though the same 226 tests pass on the Windows release runner.
          flutter build apk --release --build-name "$VERSION" --build-number "$ANDROID_BUILD_NUMBER" --dart-define=APP_VERSION="$VERSION"
          mkdir -p release-assets
          zip -j "release-assets/dzien-po-dniu-android-v${VERSION}.zip" build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*.zip
          if-no-files-found: error

  windows:
    name: Windows application
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure app
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_PUBLISHABLE_KEY)) {
            throw 'Missing required repository secret: SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY'
          }
          "SUPABASE_URL=$env:SUPABASE_URL" | Set-Content .env
          "SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" | Add-Content .env
      - name: Build Windows release
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Release tag must be vX.Y.Z; received: $tag"
            exit 1
          }
          $version = $tag.TrimStart('v')
          flutter pub get
          flutter analyze --no-pub
          flutter test
          flutter build windows --release --build-name $version --build-number $env:GITHUB_RUN_NUMBER --dart-define=APP_VERSION=$version
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release-assets/dzien-po-dniu-windows-v$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create update manifest
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          REPOSITORY="${{ github.repository }}"
          cat > release-assets/update.json <<EOF
          {
            "version": "${VERSION}",
            "androidUrl": "https://github.com/${REPOSITORY}/releases/download/${TAG}/dzien-po-dniu-android-v${VERSION}.zip",
            "windowsUrl": "https://github.com/${REPOSITORY}/releases/download/${TAG}/dzien-po-dniu-windows-v${VERSION}.zip",
            "notes": "Aktualizacje dla Androida oraz Windows."
          }
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/update.json
          fail_on_unmatched_files: true
